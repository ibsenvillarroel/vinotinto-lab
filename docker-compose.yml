services:
  postgres:
    image: postgres:16-alpine
    container_name: vinotinto-lab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinotinto_lab}
      POSTGRES_USER: ${POSTGRES_USER:-vinotinto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vinotinto_lab_dev}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - vinotinto_lab_pgdata:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vinotinto} -d ${POSTGRES_DB:-vinotinto_lab}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-vinotinto_lab}
      POSTGRES_USER: ${POSTGRES_USER:-vinotinto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vinotinto_lab_dev}
      POSTGRES_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./src:/app/src

    profiles:
      - analytics

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vinotinto-lab-api

    command:
      [
        "uvicorn",
        "vinotinto_lab.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-vinotinto_lab}
      POSTGRES_USER: ${POSTGRES_USER:-vinotinto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vinotinto_lab_dev}
      POSTGRES_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./src:/app/src
  test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"

    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-vinotinto_lab}
      POSTGRES_USER: ${POSTGRES_USER:-vinotinto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vinotinto_lab_dev}
      POSTGRES_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

    profiles:
      - test

    command:
      [
        "pytest",
        "-v",
        "/app/tests"
      ]      


volumes:
  vinotinto_lab_pgdata: