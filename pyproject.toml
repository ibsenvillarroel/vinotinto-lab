[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vinotinto-lab"
version = "0.2.0"
description = "Sports data, analytics and machine-learning platform."
requires-python = ">=3.11"

dependencies = [
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]